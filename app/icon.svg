<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Stellar mark: three overlapping circles, each passing through the composition center -->
  <!-- Centers at 120° intervals, r = distance-to-center = 25 -->
  <circle cx="50"    cy="25"   r="25" fill="#000" opacity="0.34"/>
  <circle cx="28.35" cy="62.5" r="25" fill="#000" opacity="0.34"/>
  <circle cx="71.65" cy="62.5" r="25" fill="#000" opacity="0.34"/>
</svg>
